<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestión de Actividades Deportivas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'reservas:lista_actividades' %}">Club Deportes</a>
            <div>
                <a class="btn btn-outline-light btn-sm me-2" href="{% url 'reservas:lista_actividades' %}">Ver Actividades</a>
                <a class="btn btn-primary btn-sm" href="{% url 'reservas:agregar_actividad' %}">+ Registrar Actividad</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}
    </div>
</body>
</html>
